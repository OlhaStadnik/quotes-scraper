services:
  db:
    image: postgres:15-alpine
    container_name: autoria_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoria}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-autoria}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  scraper:
    build: .
    container_name: autoria_scraper
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-autoria}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      START_URL: ${START_URL:-https://auto.ria.com/uk/car/used/}
      SCRAPE_TIME: ${SCRAPE_TIME:-12:00}
      DUMP_TIME: ${DUMP_TIME:-12:00}
      RUN_ON_STARTUP: ${RUN_ON_STARTUP:-false}
    volumes:
      - ./dumps:/app/dumps
    restart: unless-stopped

volumes:
  postgres_data:
